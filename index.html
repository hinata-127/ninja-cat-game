<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>忍者猫とティラミス — 夜の忍者の里</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b1026;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    font-family: "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
// ゲームのたね
// ・集めるもの: ティラミス
// ・よけるもの: カラス
// ・場所: 夜の忍者の里
// ・操作: 左右に動くだけ
// ・終わり方: 40秒たったら、集めた数を表示して終わり（元は60秒→陽介の指定で短縮）
//
// パワーアップ版（第3話）
// ・点数の常時表示と、最高記録の保存（ブラウザを閉じても残る）
// ・効果音（素材なし、コードだけで鳴らす。最初の操作のあとから）
// ・だんだんむずかしく（最初の10秒はやさしい。上限あり）
// ・スマホの細い画面でも遊べる

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 480, H = 720;
canvas.width = W;
canvas.height = H;

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

const GAME_TIME = 40; // 1プレイ40秒（2026-08-18 陽介の指定で60→40に短縮）
const BEST_KEY = "ninjacat_tiramisu_best_v2"; // v2: 40秒ルール移行にあわせて記録をリセット（2026-08-18）

let state = "title";   // title / play / over
let score = 0;
let best = Number(localStorage.getItem(BEST_KEY) || 0);
let isNewRecord = false;
let timeLeft = GAME_TIME;
const MAX_LIVES = 5;
let lives = MAX_LIVES;      // カラスに当たれる残り回数
let overReason = "time";    // time=時間切れ / crow=カラスにやられた
let player = { x: W / 2, y: H - 90, w: 56, speed: 320 };
let items = [];        // 落ちてくるもの
let spawnTimer = 0;
let hitFlash = 0;
let lastTime = 0;
let bigCrowTimes = []; // 大きなカラスが出る時刻（残り秒数）

// 手ざわり（第5話）
let shakeTime = 0;     // 成功の瞬間だけの小さなバウンド（残り秒数）
const SHAKE_DUR = 0.15, SHAKE_PX = 0; // 揺れオフ（陽介の指の審査）

// タメの演出（第6話）: 予告→タメ→開示
let revealT = 0;       // タメの経過秒数
let revealDur = 0.8;   // タメの長さ（2回目からは半分）
let revealCount = 0;   // 今セッションで結果発表を見た回数
let goldFlash = 0;     // 新記録のときの金色の光（残り秒数）

// ゼロ秒リトライ（第7話）
let lastScore = null;    // 直近に終わったプレイの点数
let prevRunScore = null; // その1つ前のプレイの点数（画面で「前回」として出す）
let overLock = 0;        // 負けた直後の誤タップで即再開しちゃわないためのガード

// 小さな謎（第8話）: タイトルの3つの提灯を、ティラミスの層の上→下の順（ココア→クリーム→コーヒー生地）で灯すと解ける
const LANTERN_COLORS = { cocoa: "#5a3a22", cream: "#f7edd2", sponge: "#7a5230" };
const LANTERN_ANSWER = ["cocoa", "cream", "sponge"]; // 手掛かりは画面のティラミスそのもの
let lanterns = [];          // {x, y, color, lit}
let lanternProgress = 0;    // いま何個目まで正しく灯せているか
let lanternSolved = false;  // このタイトル画面で解けたか
let pendingBonusHearts = false; // 次の1プレイをハート6個にする
let startLives = 5;         // 今プレイの開始時ハート数（描画用）

function setupLanterns() {
  const colors = Object.keys(LANTERN_COLORS);
  // 毎回シャッフル（丸暗記では解けない。色を見て気づく）
  for (let i = colors.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [colors[i], colors[j]] = [colors[j], colors[i]];
  }
  lanterns = colors.map((c, i) => ({ x: 70 + i * 85, y: 118, color: c, lit: false }));
  lanternProgress = 0;
  lanternSolved = false;
}
setupLanterns();

function tapLantern(l) {
  if (lanternSolved || l.lit) return;
  if (l.color === LANTERN_ANSWER[lanternProgress]) {
    l.lit = true;
    lanternProgress++;
    beep(660 + lanternProgress * 110, 0.1, "triangle", 0.15);
    if (lanternProgress === LANTERN_ANSWER.length) {
      lanternSolved = true;
      pendingBonusHearts = true;
      soundJackpot();
    }
  } else {
    // 間違い: 罰なし。静かに全部消えて、何度でも試せる
    lanterns.forEach((k) => (k.lit = false));
    lanternProgress = 0;
    beep(150, 0.12, "sine", 0.08);
  }
}
let squash = 0;        // 押した瞬間の沈み込み 0〜1
let lean = 0;          // 進行方向への傾き

// ---- 効果音（コードだけで鳴らす） ----
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur, type, vol, when, slideTo) {
  if (!audioCtx || audioCtx.state !== "running") return;
  const t0 = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || "triangle";
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  gain.gain.setValueAtTime(vol || 0.15, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
// 同じ音の重ね鳴り防止（連打で耳が痛くならないように）
const lastPlayed = {};
function canPlay(name, gap) {
  const now = performance.now();
  if (lastPlayed[name] && now - lastPlayed[name] < gap) return false;
  lastPlayed[name] = now;
  return true;
}
function soundCollect() {  // 集めた: かわいい2音
  if (!canPlay("collect", 60)) return;
  beep(880, 0.09, "triangle", 0.18);
  beep(1318, 0.12, "triangle", 0.15, 0.07);
}
function soundStep() {     // 押した瞬間の「コッ」
  if (!canPlay("step", 70)) return;
  beep(320, 0.05, "square", 0.06, 0, 240);
}
function soundHit() {      // カラス: 下がる音
  beep(220, 0.25, "sawtooth", 0.18, 0, 80);
}
function soundBigHit() {   // 大カラス: 低いドーン
  beep(120, 0.5, "sawtooth", 0.25, 0, 40);
  beep(60, 0.5, "square", 0.2, 0.05, 30);
}
function soundFinish() {   // 終了ファンファーレ
  beep(660, 0.12, "triangle", 0.18);
  beep(880, 0.12, "triangle", 0.18, 0.12);
  beep(1108, 0.3, "triangle", 0.18, 0.24);
}
function soundGameOver() { // やられた: しょんぼり下がる3音
  beep(440, 0.18, "square", 0.15);
  beep(330, 0.18, "square", 0.15, 0.18);
  beep(220, 0.45, "square", 0.15, 0.36, 110);
}
function soundTame() {     // タメ: 低く静かなうなり
  beep(110, 0.7, "sine", 0.08, 0, 165);
}
function soundJackpot() {  // 新記録: 豪華ファンファーレ
  beep(660, 0.1, "triangle", 0.2);
  beep(880, 0.1, "triangle", 0.2, 0.1);
  beep(1108, 0.1, "triangle", 0.2, 0.2);
  beep(1318, 0.35, "triangle", 0.22, 0.3);
  beep(1760, 0.5, "sine", 0.1, 0.32, 2200);
}

// ---- 入力 ----
const keys = { left: false, right: false };
let touchDir = 0;

document.addEventListener("keydown", (e) => {
  unlockAudio();
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.repeat && state === "play") soundStep();
  if (e.key === "ArrowLeft") keys.left = true;
  if (e.key === "ArrowRight") keys.right = true;
  if (state === "reveal" && (e.key === " " || e.key === "Enter")) { doReveal(); return; }
  if ((state === "title" || (state === "over" && overLock <= 0)) && (e.key === " " || e.key === "Enter")) startGame();
});
document.addEventListener("keyup", (e) => {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
});

// タッチ: 画面の左半分＝左へ、右半分＝右へ（画面ぜんぶがボタン）
function touchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return (t.clientX - rect.left) / rect.width * W;
}
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {
    x: (t.clientX - rect.left) / rect.width * W,
    y: (t.clientY - rect.top) / rect.height * H,
  };
}

function goTitle() {
  state = "title";
  setupLanterns(); // 提灯はタイトルに戻るたび並び替え
}

// タイトル画面のタップ振り分け: 提灯に当たれば謎、それ以外はゲーム開始
function handleTitleTap(e) {
  const p = canvasPos(e);
  const hit = lanterns.find((l) => Math.abs(p.x - l.x) < 34 && Math.abs(p.y - l.y) < 46);
  if (hit) { tapLantern(hit); return; }
  startGame();
}

// ゲームオーバー画面のタップ振り分け: 左下の「さとにもどる」だけ別扱い
function handleOverTap(e) {
  const p = canvasPos(e);
  if (p.x < 140 && p.y > H - 70) { goTitle(); return; }
  startGame();
}
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  unlockAudio();
  if (state === "reveal") { doReveal(); return; }
  if (state === "title") { handleTitleTap(e); return; }
  if (state === "over") {
    if (overLock > 0) return;
    handleOverTap(e);
    return;
  }
  touchDir = touchPos(e) < W / 2 ? -1 : 1;
  soundStep();
}, { passive: false });
canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (state === "play") touchDir = touchPos(e) < W / 2 ? -1 : 1;
}, { passive: false });
canvas.addEventListener("touchend", (e) => { e.preventDefault(); touchDir = 0; }, { passive: false });
canvas.addEventListener("mousedown", (e) => {
  unlockAudio();
  if (state === "reveal") { doReveal(); return; }
  if (state === "title") { handleTitleTap(e); return; }
  if (state === "over") {
    if (overLock > 0) return;
    handleOverTap(e);
  }
});

function startGame() {
  state = "play";
  score = 0;
  isNewRecord = false;
  timeLeft = GAME_TIME;
  startLives = MAX_LIVES + (pendingBonusHearts ? 1 : 0); // 提灯の謎を解いていたらハート6個
  pendingBonusHearts = false;
  lives = startLives;
  overReason = "time";
  items = [];
  spawnTimer = 0;
  hitFlash = 0;
  goldFlash = 0;
  shakeTime = 0;
  player.x = W / 2;
  bigCrowTimes = [25, 12]; // 残り25秒と12秒に大きなカラスが来る（40秒プレイ用）
}

function finishGame(reason) {
  overReason = reason || "time";
  prevRunScore = lastScore; // 1つ前のプレイの点数を「前回」として並べる
  lastScore = score;
  if (score > best) {
    best = score;
    isNewRecord = true;
    localStorage.setItem(BEST_KEY, String(best));
  }
  if (overReason === "crow") {
    // 失敗は待たせない。即ゲームオーバー（でも新記録ならお祝いはする）
    state = "over";
    overLock = 0.35; // 死んだ瞬間の連打で気づかないうちに再開しちゃわないように
    if (isNewRecord) {
      goldFlash = 1.0;
      soundJackpot();
    } else {
      soundGameOver();
    }
    return;
  }
  // 時間切れ→結果発表の前にタメを入れる（2回目からは半分、タップで飛ばせる）
  state = "reveal";
  revealT = 0;
  revealDur = revealCount === 0 ? 0.8 : 0.4;
  revealCount++;
  soundTame();
}

function doReveal() {
  if (state !== "reveal") return;
  state = "over";
  overLock = 0.35;
  if (isNewRecord) {
    goldFlash = 1.0;
    soundJackpot();
  } else {
    soundFinish();
  }
}

// ---- むずかしさ（0=やさしい 〜 1=最大） ----
function difficulty() {
  const elapsed = GAME_TIME - timeLeft;
  if (elapsed < 10) return 0;              // はじめの10秒はやさしいまま
  return Math.min(1, (elapsed - 10) / 25); // そのあとゆっくり上がって、終盤で上限に届く
}

function spawnItem() {
  const d = difficulty();
  const crowRate = 0.18 + d * 0.14;        // カラスの割合: 18% → 32%
  const isCrow = Math.random() < crowRate;
  items.push({
    type: isCrow ? "crow" : "tiramisu",
    x: 30 + Math.random() * (W - 60),
    y: -40,
    vy: (120 + Math.random() * 100) * (1 + d * 0.7),  // 落ちる速さも少しずつ上がる
    sway: (Math.random() - 0.5) * (60 + d * 60),
    t: Math.random() * Math.PI * 2,
    r: 42,
  });
}

function spawnBigCrow() {
  // 途中で来る大きなカラス。当たるとティラミス3個減る
  items.push({
    type: "bigcrow",
    x: 60 + Math.random() * (W - 120),
    y: -80,
    vy: 100,
    sway: 90,
    t: Math.random() * Math.PI * 2,
    r: 70,
  });
}

function update(dt) {
  if (goldFlash > 0) goldFlash -= dt;
  if (overLock > 0) overLock -= dt;
  if (state === "reveal") {
    revealT += dt;
    if (revealT >= revealDur) doReveal();
    return;
  }
  if (state !== "play") return;

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; finishGame("time"); return; }

  // 決めた時刻になったら、大きなカラスを落とす
  if (bigCrowTimes.length > 0 && timeLeft <= bigCrowTimes[0]) {
    bigCrowTimes.shift();
    spawnBigCrow();
  }

  // プレイヤー移動
  let dir = 0;
  if (keys.left) dir -= 1;
  if (keys.right) dir += 1;
  if (touchDir !== 0) dir = touchDir;
  player.x += dir * player.speed * dt;
  player.x = Math.max(30, Math.min(W - 30, player.x));

  // 手ざわり: 押している間は沈み、進行方向に傾く（0.1秒以内に応える）
  const squashTarget = dir !== 0 ? 1 : 0;
  squash += (squashTarget - squash) * Math.min(1, dt * 18);
  lean += (dir * 0.14 - lean) * Math.min(1, dt * 14);

  // 出現（だんだん間隔が短くなる。上限あり）
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnItem();
    spawnTimer = 0.75 - difficulty() * 0.33;  // 0.75秒 → 0.42秒
  }

  // 落下と当たり判定
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.t += dt * 2;
    it.y += it.vy * dt;
    it.x += Math.sin(it.t) * it.sway * dt;

    const dx = it.x - player.x;
    const dy = it.y - player.y;
    if (Math.abs(dx) < it.r && Math.abs(dy) < it.r) {
      if (it.type === "tiramisu") {
        score++;
        soundCollect();
        shakeTime = SHAKE_DUR; // 成功の瞬間だけ、小さく揺れる
      } else if (it.type === "bigcrow") {
        // ボスガラスは一発アウト。とどめのカラスは消さずに光らせて残す（負けた原因の証拠品）
        hitFlash = 0.8;
        soundBigHit();
        it.killer = true;
        finishGame("crow");
        return;
      } else {
        score = Math.max(0, score - 1);
        lives--;
        hitFlash = 0.35;
        soundHit();
        if (lives <= 0) {
          it.killer = true;
          finishGame("crow");
          return;
        }
      }
      items.splice(i, 1);
      continue;
    }
    if (it.y > H + 90) items.splice(i, 1);
  }

  if (hitFlash > 0) hitFlash -= dt;
  if (shakeTime > 0) shakeTime -= dt;
}

// ---- 描画 ----

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0b1026");
  sky.addColorStop(0.7, "#1a2340");
  sky.addColorStop(1, "#2a3050");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "rgba(255,255,255,0.8)";
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137.5) % W;
    const sy = (i * 89.3) % (H * 0.6);
    const tw = 0.5 + Math.abs(Math.sin(Date.now() / 700 + i)) * 1.3;
    ctx.fillRect(sx, sy, tw, tw);
  }

  ctx.fillStyle = "#f5e9c8";
  ctx.beginPath();
  ctx.arc(W - 90, 100, 42, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#e8d9ae";
  ctx.beginPath();
  ctx.arc(W - 100, 92, 8, 0, Math.PI * 2);
  ctx.arc(W - 78, 112, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#0d1220";
  for (let i = 0; i < 5; i++) {
    const bx = i * 110 - 30;
    const bh = 90 + (i % 3) * 35;
    ctx.fillRect(bx, H - bh, 90, bh);
    ctx.beginPath();
    ctx.moveTo(bx - 14, H - bh);
    ctx.quadraticCurveTo(bx + 45, H - bh - 42, bx + 104, H - bh);
    ctx.fill();
    ctx.fillStyle = "#f7c873";
    ctx.fillRect(bx + 34, H - bh + 26, 14, 14);
    ctx.fillStyle = "#0d1220";
  }

  ctx.fillStyle = "#161c30";
  ctx.fillRect(0, H - 40, W, 40);
}

function drawTiramisu(x, y, size) {
  // 手描きティラミス: コーヒー生地とクリームの3層＋ココアパウダー
  const w = size, h = size * 0.82;
  ctx.save();
  ctx.translate(x, y);
  const l = -w / 2, t = -h / 2;
  // コーヒー生地（下段・中段）
  ctx.fillStyle = "#7a5230";
  ctx.fillRect(l, t + h * 0.62, w, h * 0.38);          // 下の生地
  ctx.fillStyle = "#f7edd2";
  ctx.fillRect(l, t + h * 0.44, w, h * 0.18);          // クリーム
  ctx.fillStyle = "#7a5230";
  ctx.fillRect(l, t + h * 0.30, w, h * 0.14);          // 中の生地
  ctx.fillStyle = "#f7edd2";
  ctx.fillRect(l, t + h * 0.16, w, h * 0.14);          // 上のクリーム
  // ココアパウダーの天面
  ctx.fillStyle = "#5a3a22";
  ctx.fillRect(l, t, w, h * 0.16);
  // ココアの粉っぽさ（点々）
  ctx.fillStyle = "#3f2817";
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(l + (i * 0.19 + 0.06) * w, t + h * 0.04, w * 0.05, h * 0.05);
  }
  // ふち
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(l, t, w, h);
  ctx.restore();
}

function drawLantern(l) {
  ctx.save();
  ctx.translate(l.x, l.y);
  // 天井から下がる紐
  ctx.strokeStyle = "rgba(255,255,255,0.3)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -l.y);
  ctx.lineTo(0, -30);
  ctx.stroke();
  // 灯った提灯のまわりの光
  if (l.lit) {
    const color = lanternSolved ? "255,215,120" : "255,240,200";
    const g = ctx.createRadialGradient(0, 0, 5, 0, 0, 55);
    g.addColorStop(0, "rgba(" + color + ",0.5)");
    g.addColorStop(1, "rgba(" + color + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 55, 0, Math.PI * 2);
    ctx.fill();
  }
  // 上下のふた
  ctx.fillStyle = "#2b2418";
  ctx.fillRect(-10, -32, 20, 6);
  ctx.fillRect(-10, 26, 20, 6);
  // 火袋（色が手掛かり）
  ctx.fillStyle = LANTERN_COLORS[l.color];
  ctx.beginPath();
  ctx.ellipse(0, -2, 22, 28, 0, 0, Math.PI * 2);
  ctx.fill();
  // 骨の線
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-21, -8); ctx.lineTo(21, -8);
  ctx.moveTo(-21, 6); ctx.lineTo(21, 6);
  ctx.stroke();
  // 消えている間は少し暗く
  if (!l.lit) {
    ctx.fillStyle = "rgba(10,12,30,0.45)";
    ctx.beginPath();
    ctx.ellipse(0, -2, 22, 28, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEmoji(emoji, x, y, size, flip) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.font = size + "px serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(emoji, 0, 0);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, 54);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  drawTiramisu(32, 27, 24);
  ctx.fillText(String(score), 52, 28);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd97a";
  ctx.font = "bold 18px sans-serif";
  ctx.fillText("最高 " + best, W / 2, 28);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("⏱ " + Math.ceil(timeLeft), W - 20, 28);

  // 残機ハート（カラスに当たれる残り回数。提灯の謎ボーナス中は6個）
  ctx.font = "18px serif";
  ctx.textAlign = "left";
  let hearts = "";
  for (let i = 0; i < startLives; i++) hearts += i < lives ? "❤️" : "🖤";
  ctx.fillText(hearts, 16, 74);
}

function drawCenterPanel() {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, W, H);
}

function draw() {
  // 画面揺れは陽介の指の審査でオフに決定（2026-08-18）。SHAKE_PXを0以外にすると復活する
  ctx.save();
  if (shakeTime > 0 && state === "play" && SHAKE_PX > 0) {
    const p = shakeTime / SHAKE_DUR; // 1→0
    ctx.translate(0, -Math.sin(p * Math.PI) * SHAKE_PX);
  }

  drawBackground();

  if (state === "play" || state === "over" || state === "reveal") {
    for (const it of items) {
      if (it.type === "tiramisu") drawTiramisu(it.x, it.y, 36);
      else if (it.type === "bigcrow") drawEmoji("🐦‍⬛", it.x, it.y, 110);
      else drawEmoji("🐦‍⬛", it.x, it.y, 40);
    }
    // 忍者猫: 押している間は少し沈んで、進行方向に傾く
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(lean);
    ctx.translate(0, squash * 3);
    ctx.scale(1 + squash * 0.06, 1 - squash * 0.08);
    drawEmoji("🐈‍⬛", 0, 0, 56);
    ctx.strokeStyle = "#d43f3f";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-20, -18);
    ctx.lineTo(20, -18);
    ctx.stroke();
    ctx.restore();
    drawHUD();
  }

  if (hitFlash > 0) {
    ctx.fillStyle = "rgba(255,60,60," + hitFlash * 0.5 + ")";
    ctx.fillRect(0, 0, W, H);
  }

  ctx.textBaseline = "alphabetic";

  if (state === "title") {
    drawCenterPanel();
    // 小さな謎: 3つの提灯（説明はしない。色に気づいた人だけのお楽しみ）
    lanterns.forEach(drawLantern);
    if (lanternSolved) {
      ctx.textAlign = "center";
      ctx.font = "bold 17px sans-serif";
      ctx.fillStyle = "#ffd97a";
      ctx.fillText("あかりが そろった！ 次のプレイは ❤️ 6つ", W / 2, 195);
    }
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 34px sans-serif";
    ctx.fillText("忍者猫と", W / 2, H / 2 - 60);
    ctx.fillText("ティラミス", W / 2, H / 2 - 8);
    if (best > 0) {
      ctx.font = "bold 22px sans-serif";
      ctx.fillStyle = "#ffd97a";
      ctx.fillText("これまでの最高記録: " + best + " 個", W / 2, H / 2 + 46);
    }
    ctx.font = "20px sans-serif";
    ctx.fillStyle = "#ffd97a";
    ctx.fillText("タップ か スペースキーで はじめる", W / 2, H / 2 + 110);
    drawEmoji("🐈‍⬛", W / 2, H / 2 + 170, 64);
    ctx.font = "18px sans-serif";
    ctx.fillStyle = "#ccd6ff";
    ctx.fillText("ティラミスをあつめて 🐦‍⬛カラスをよけろ！", W / 2, H / 2 + 240);
    ctx.fillText("カラス5回 か ボスガラス1回で ゲームオーバー", W / 2, H / 2 + 268);
    ctx.fillText("← →キー か 画面の左右タッチでうごく", W / 2, H / 2 + 296);
  }

  if (state === "reveal") {
    // 予告→タメ: 暗くなって、ティラミスが震えて光る。結果はまだ見せない
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, W, H);
    const pulse = 0.5 + Math.abs(Math.sin(Date.now() / 180)) * 0.5;
    // 光の輪（予告）
    const g = ctx.createRadialGradient(W / 2, H / 2 - 40, 6, W / 2, H / 2 - 40, 90);
    g.addColorStop(0, "rgba(255,225,150," + 0.35 * pulse + ")");
    g.addColorStop(1, "rgba(255,225,150,0)");
    ctx.fillStyle = g;
    ctx.fillRect(W / 2 - 100, H / 2 - 140, 200, 200);
    // 震えるティラミス（画面は動かさず、モノだけ震える）
    const jx = (Math.random() * 2 - 1) * 1.5;
    const jy = (Math.random() * 2 - 1) * 1.5;
    drawTiramisu(W / 2 + jx, H / 2 - 40 + jy, 46);
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255," + (0.6 + 0.4 * pulse) + ")";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText("結果発表…", W / 2, H / 2 + 50);
    ctx.font = "16px sans-serif";
    ctx.fillStyle = "#ccd6ff";
    ctx.fillText("タップで結果を見る", W / 2, H / 2 + 90);
  }

  if (state === "over") {
    drawCenterPanel();

    // 負けた原因の表示: とどめを刺したカラスがその場で光る（盤面は消さない）
    const killer = items.find((k) => k.killer);
    if (killer) {
      const pulse = 0.5 + Math.abs(Math.sin(Date.now() / 220)) * 0.5;
      const kr = killer.type === "bigcrow" ? 80 : 42;
      const kg = ctx.createRadialGradient(killer.x, killer.y, 4, killer.x, killer.y, kr);
      kg.addColorStop(0, "rgba(255,90,70," + 0.55 * pulse + ")");
      kg.addColorStop(1, "rgba(255,90,70,0)");
      ctx.fillStyle = kg;
      ctx.beginPath();
      ctx.arc(killer.x, killer.y, kr, 0, Math.PI * 2);
      ctx.fill();
      drawEmoji("🐦‍⬛", killer.x, killer.y, killer.type === "bigcrow" ? 110 : 40);
    }

    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 34px sans-serif";
    if (overReason === "crow") {
      ctx.fillText("カラスにやられた…！", W / 2, H / 2 - 100);
    } else {
      ctx.fillText("おわり！", W / 2, H / 2 - 100);
    }
    ctx.font = "bold 44px sans-serif";
    ctx.fillStyle = "#ffe9a8";
    ctx.fillText("今回の点数 " + score + " 個", W / 2, H / 2 - 36);
    // 前回の記録をすぐ下に並べる（一番身近なライバルは1分前の自分）
    ctx.font = "20px sans-serif";
    ctx.fillStyle = "#ccd6ff";
    ctx.fillText(prevRunScore === null ? "前回 まだなし" : "前回 " + prevRunScore + " 個", W / 2, H / 2 + 0);
    ctx.font = "bold 26px sans-serif";
    if (isNewRecord) {
      const blink = Math.abs(Math.sin(Date.now() / 250));
      ctx.fillStyle = "rgba(255,217,122," + (0.5 + blink * 0.5) + ")";
      ctx.fillText("✨ 新記録！ ✨", W / 2, H / 2 + 44);
    } else {
      ctx.fillStyle = "#ffd97a";
      ctx.fillText("これまでの最高記録 " + best + " 個", W / 2, H / 2 + 44);
    }
    ctx.font = "20px sans-serif";
    ctx.fillStyle = "#ffd97a";
    ctx.fillText("タップ か スペースキーで もういちど", W / 2, H / 2 + 110);

    // タイトルへ戻る導線（小さめに）
    ctx.font = "16px sans-serif";
    ctx.fillStyle = "rgba(204,214,255,0.7)";
    ctx.textAlign = "left";
    ctx.fillText("← さとにもどる", 20, H - 30);
    ctx.textAlign = "center";

    // 新記録の開示: 金色の光がふわっと出て消える（画面は動かさない）
    if (goldFlash > 0) {
      ctx.fillStyle = "rgba(255,205,90," + goldFlash * 0.45 + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  ctx.restore(); // 画面揺れのぶんを戻す
}

function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 動作確認用（ゲームには影響しない）
window._debug = {
  start: () => startGame(),
  spawnBigCrow: () => spawnBigCrow(),
  items: () => items,
  setTime: (t) => { timeLeft = t; },
  setScore: (s) => { score = s; },
  setLives: (n) => { lives = n; },
  finish: (r) => finishGame(r),
  difficulty: () => difficulty(),
  press: (d) => { keys.left = d < 0; keys.right = d > 0; },
  reveal: () => doReveal(),
  goTitle: () => goTitle(),
  lanterns: () => lanterns.map(l => ({ color: l.color, lit: l.lit })),
  tapLantern: (i) => tapLantern(lanterns[i]),
  puzzle: () => ({ lanternProgress, lanternSolved, pendingBonusHearts, startLives }),
  state: () => ({ state, score, best, lives, overReason, timeLeft, lastScore, prevRunScore, overLock: +overLock.toFixed(2), killer: items.some(k => k.killer), revealT: +revealT.toFixed(2), revealDur, revealCount, goldFlash: +goldFlash.toFixed(2), squash: +squash.toFixed(2), lean: +lean.toFixed(2), bigCrowTimes: bigCrowTimes.slice() }),
};
</script>
</body>
</html>
